# Ruff configuration for Python linting (ADM-001)
[tool.ruff]
target-version = "py310"
line-length = 100
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
]
ignore = [
  "E501",   # line too long (handled by formatter)
]

[tool.ruff.isort]
known-first-party = []
profile = "black"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
